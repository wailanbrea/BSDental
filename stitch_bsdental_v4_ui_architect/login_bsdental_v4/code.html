<!DOCTYPE html>

<html lang="es"><head>

                    "secondary-fixed-dim": "#b7c8e1",
                    "surface-bright": "#faf8ff",
                    "primary": "#005c55",

                    "on-tertiary-fixed": "#00174b",
                    "tertiary-container": "#1e5fe7",
                    "on-error": "#ffffff",

                    "surface-variant": "#dae2fd",
                    "primary-fixed": "#9cf2e8",
                    "surface": "#faf8ff",
                    "surface-container-highest": "#dae2fd",

            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",

            "spacing": {
                    "compact-padding": "8px",
                    "gutter": "16px",
                    "standard-padding": "16px",
                    "section-gap": "32px",
                    "unit": "4px",
                    "container-margin": "24px"
            },
            "fontFamily": {
                    "section-title": ["Inter"],
                    "headline-sm": ["Inter"],
                    "label-caps": ["Inter"],
                    "display-lg": ["Inter"],
                    "display-md": ["Inter"],

                    "data-tabular": ["Inter"]

<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-gutter">
<div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0px_4px_12px_rgba(15,23,42,0.08)] overflow-hidden">
<div class="p-section-gap flex flex-col items-center border-b border-outline-variant bg-surface">
<div class="w-16 h-16 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center mb-standard-padding">
<span class="material-symbols-outlined text-display-md" data-icon="medical_services">medical_services</span>
</div>
<h1 class="font-display-md text-display-md text-primary font-bold">BSDental v4</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-unit text-center">Acceso al sistema</p>
</div>
<form class="p-section-gap space-y-standard-padding">
<div class="flex flex-col space-y-unit">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="email">Correo Electrónico</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</div>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface transition-colors" id="email" placeholder="usuario@clinica.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col space-y-unit">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="password">Contraseña</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="w-full pl-10 pr-10 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface transition-colors" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between pt-unit">
<div class="flex items-center">
<input class="w-4 h-4 text-primary bg-surface-container-lowest border-outline-variant rounded focus:ring-primary focus:ring-2" id="remember" type="checkbox"/>
<label class="ml-2 font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none" for="remember">
                        Recordarme
                    </label>
</div>
<a class="font-body-sm text-body-sm text-primary font-semibold hover:text-on-primary-fixed-variant transition-colors focus:outline-none focus:underline" href="#">
                    ¿Olvidaste tu contraseña?
                </a>
</div>
<div class="pt-container-margin">
<button class="w-full bg-primary text-on-primary font-section-title text-section-title py-3 rounded-lg hover:bg-on-primary-fixed-variant active:bg-primary-fixed-dim transition-colors flex justify-center items-center gap-2 shadow-[0px_2px_4px_rgba(0,0,0,0.1)] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary focus:ring-offset-surface-container-lowest" type="submit">
                    Iniciar sesión
                    <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<div class="p-standard-padding bg-surface text-center border-t border-outline-variant">
<p class="font-body-sm text-body-sm text-on-surface-variant opacity-75">
                Plataforma Clínica Segura
            </p>
</div>
</div>
</body></html>
