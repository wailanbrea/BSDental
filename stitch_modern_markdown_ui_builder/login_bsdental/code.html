<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BSDental - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#6e7977",
                        "on-primary-container": "#a3faef",
                        "surface-container-high": "#dce9ff",
                        "on-primary-fixed-variant": "#00504a",
                        "primary": "#005c55",
                        "inverse-primary": "#80d5cb",
                        "danger": "#DC2626",
                        "primary-fixed-dim": "#80d5cb",
                        "warning": "#D97706",
                        "secondary-fixed": "#bdece2",
                        "on-background": "#0b1c30",
                        "on-surface-variant": "#3e4947",
                        "on-error-container": "#93000a",
                        "surface-container-lowest": "#ffffff",
                        "info": "#2563EB",
                        "tertiary": "#7f4025",
                        "on-tertiary-container": "#ffe5db",
                        "on-tertiary-fixed": "#370e00",
                        "surface-container-highest": "#d3e4fe",
                        "on-error": "#ffffff",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "inverse-surface": "#213145",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#72361b",
                        "primary-fixed": "#9cf2e8",
                        "success": "#16A34A",
                        "on-secondary-fixed-variant": "#224e47",
                        "surface-container-low": "#eff4ff",
                        "secondary": "#3b665f",
                        "tertiary-fixed": "#ffdbce",
                        "surface-variant": "#d3e4fe",
                        "surface-muted": "#F1F5F9",
                        "primary-container": "#0f766e",
                        "tertiary-fixed-dim": "#ffb598",
                        "on-primary-fixed": "#00201d",
                        "outline-variant": "#bdc9c6",
                        "on-secondary-fixed": "#00201c",
                        "text-main": "#0F172A",
                        "surface": "#FFFFFF",
                        "surface-tint": "#006a63",
                        "tertiary-container": "#9c573a",
                        "surface-container": "#e5eeff",
                        "secondary-fixed-dim": "#a2d0c6",
                        "surface-bright": "#f8f9ff",
                        "surface-dim": "#cbdbf5",
                        "on-secondary-container": "#416c65",
                        "inverse-on-surface": "#eaf1ff",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#bdece2",
                        "on-tertiary": "#ffffff",
                        "background": "#F8FAFC",
                        "border-subtle": "#E2E8F0",
                        "on-surface": "#0b1c30"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-max": "1440px",
                        "sm": "8px",
                        "sidebar-width": "260px",
                        "xl": "32px",
                        "base": "4px",
                        "md": "16px",
                        "sidebar-collapsed": "72px",
                        "lg": "24px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "data-mono": ["Inter"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-sm": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "data-mono": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-md": ["13px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-md">
<!-- Login Container -->
<main class="w-full max-w-[440px] bg-surface border border-border-subtle rounded-xl shadow-[0px_4px_12px_rgba(15,23,42,0.05)] p-xl relative overflow-hidden">
<!-- Subtle Accent Header Bar -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>
<!-- Brand Logo Area -->
<div class="flex flex-col items-center mb-xl text-center">
<div class="w-16 h-16 bg-surface-container-low rounded-lg flex items-center justify-center mb-md border border-border-subtle">
<span class="material-symbols-outlined text-[32px] text-primary" style="font-variation-settings: 'FILL' 1;">medical_services</span>
</div>
<h1 class="font-headline-md text-headline-md text-text-main">BSDental</h1>
<p class="font-body-md text-body-md text-outline mt-sm">Clinical ERP Platform</p>
</div>
<!-- Login Form -->
<form class="space-y-lg">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-text-main" for="email">Correo Electrónico</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">mail</span>
</div>
<input class="w-full pl-10 pr-3 py-2 bg-surface border border-border-subtle rounded-lg font-body-md text-body-md text-text-main placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-2 focus:ring-secondary-container/50 transition-shadow" id="email" name="email" placeholder="doctor@bsdental.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-text-main flex justify-between" for="password">
                    Contraseña
                    <a class="text-primary hover:text-primary-container transition-colors" href="#">¿Olvidaste tu contraseña?</a>
</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">lock</span>
</div>
<input class="w-full pl-10 pr-10 py-2 bg-surface border border-border-subtle rounded-lg font-body-md text-body-md text-text-main placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-2 focus:ring-secondary-container/50 transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer">
<span class="material-symbols-outlined text-outline hover:text-text-main transition-colors text-[20px]">visibility_off</span>
</div>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-border-subtle rounded cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-outline cursor-pointer" for="remember-me">
                    Mantener sesión iniciada
                </label>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary-container hover:bg-surface-tint focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors" type="submit">
                Iniciar sesión
            </button>
</form>
<!-- System Status / Info -->
<div class="mt-xl pt-md border-t border-border-subtle text-center">
<p class="font-label-sm text-label-sm text-outline-variant flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[16px] text-success">check_circle</span>
                 All systems operational v2.4.1
             </p>
</div>
</main>
</body></html>
